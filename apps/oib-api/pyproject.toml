[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "depot-readiness-api"
version = "0.1.0"
description = "FastAPI service for Depot Readiness AI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.19.2",
  "fastapi==0.141.1",
  "greenlet==3.5.5",
  "PyJWT[crypto]==2.13.0",
  "psycopg==3.3.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=app --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["psycopg.*"]
ignore_missing_imports = true
