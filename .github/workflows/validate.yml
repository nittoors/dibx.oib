name: Validate OIB release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: dbix
          POSTGRES_USER: dbix_admin
          POSTGRES_PASSWORD: ci-only-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbix_admin -d dbix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate web
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/oib-api/requirements-dev.lock
      - name: Install isolated API dependencies
        run: python -m venv .venv-oib && .venv-oib/bin/python -m pip install --requirement apps/oib-api/requirements-dev.lock
      - name: Validate API and seeded data parity
        run: |
          .venv-oib/bin/ruff check apps/oib-api
          .venv-oib/bin/mypy --config-file apps/oib-api/pyproject.toml apps/oib-api/app apps/oib-api/tests
          PYTHONPATH=apps/oib-api DB_HOST=127.0.0.1 DB_NAME=oib_readiness DB_MAINTENANCE_NAME=dbix DB_USER=dbix_admin DB_PASSWORD=ci-only-admin DB_SSLMODE=disable .venv-oib/bin/python -m app.bootstrap_database
          cd apps/oib-api
          DATABASE_URL=postgresql+psycopg://dbix_admin:ci-only-admin@127.0.0.1:5432/oib_readiness ../../.venv-oib/bin/alembic upgrade head
          DATABASE_URL=postgresql+psycopg://dbix_admin:ci-only-admin@127.0.0.1:5432/oib_readiness ../../.venv-oib/bin/alembic check
          DATABASE_URL=postgresql+psycopg://dbix_admin:ci-only-admin@127.0.0.1:5432/oib_readiness ../../.venv-oib/bin/python -m app.seed --manifest ../../data/oib/seed/manifest.json
          DATABASE_URL=postgresql+psycopg://dbix_admin:ci-only-admin@127.0.0.1:5432/oib_readiness ../../.venv-oib/bin/python -m app.reconcile --baseline ../../docs/oib-source/baseline-kpis.json
          DB_HOST=127.0.0.1 DB_NAME=oib_readiness DB_USER=dbix_admin DB_PASSWORD=ci-only-admin DB_SSLMODE=disable APP_DB_USER=dbix_oib_app APP_DB_PASSWORD=ci-only-oib-app ../../.venv-oib/bin/python -m app.provision_database_role
          DATABASE_URL=postgresql+psycopg://dbix_admin:ci-only-admin@127.0.0.1:5432/oib_readiness ../../.venv-oib/bin/python -m pytest

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build production images without pushing
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          push: false
          files: docker-bake.hcl
          set: '*.args.SOURCE_REVISION=${{ github.sha }}'
